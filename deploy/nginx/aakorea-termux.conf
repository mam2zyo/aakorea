server {
    listen 8080;
    server_name maumtalk.win www.maumtalk.win localhost 127.0.0.1 _;

    charset utf-8;

    # 1. 관리자 화면 (React Office - Static SPA)
    # /office 경로로 접속 시 office/dist 폴더의 정적 파일 서빙
    location /office {
        alias /data/data/com.termux/files/home/aakorea/office;
        index index.html;
        try_files $uri $uri/ /office/index.html;
    }

    # 2. 사용자 웹 (SvelteKit - SSR via Node.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. 백엔드 API (Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 로그 설정 (스크린샷의 ~/aakorea/log 폴더 활용)
    access_log /data/data/com.termux/files/home/aakorea/log/nginx_access.log;
    error_log /data/data/com.termux/files/home/aakorea/log/nginx_error.log;

    # 5. 최적화
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

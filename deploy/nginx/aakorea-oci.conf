server {
    listen 80;
    server_name maumtalk.win www.maumtalk.win localhost 127.0.0.1 _;

    charset utf-8;
    port_in_redirect off;
    absolute_redirect off;

    # 1. 관리자 화면 (React Office - Static SPA)
    # /office 경로로 접속 시 office 폴더의 정적 파일 서빙
    location /office {
        alias /home/ubuntu/aakorea/office;
        index index.html;
        try_files $uri $uri/ /office/index.html;

        # 정적 파일 캐싱 설정
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 사용자 웹 (SvelteKit - SSR via Node.js)
    # /office와 /api를 제외한 모든 요청은 SvelteKit Node 서버로 전달
    location / {
        proxy_pass http://localhost:3000; # SvelteKit Node 서버 실행 포트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. 백엔드 API (Spring Boot)
    # 3-1. 정적 에셋 직접 서빙 (성능 및 경로 호환성 개선)
    location /api/public/assets/ {
        alias /home/ubuntu/aakorea/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 로그 설정
    access_log /home/ubuntu/aakorea/log/nginx_access.log;
    error_log /home/ubuntu/aakorea/log/nginx_error.log;

    # 5. 최적화
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

server {
    listen 80;
    # server_name aakorea.org; # 실환경 도메인으로 변경하세요

    # 1. 관리자 화면 (React Office - Static SPA)
    # /office 경로로 접속 시 office/dist 폴더의 정적 파일 서빙
    location /office {
        alias /home/mam2z/project/aakorea/office/dist;
        index index.html;
        try_files $uri $uri/ /office/index.html;
        
        # 정적 파일 캐싱 설정 (성능 개선)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 사용자 웹 (SvelteKit - SSR via Node.js)
    # /office와 /api를 제외한 모든 요청은 SvelteKit Node 서버로 전달
    location / {
        proxy_pass http://localhost:3000; # SvelteKit Node 서버 실행 포트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. 백엔드 API (Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 보안 및 기타 최적화 (Gzip 등)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 5. 로그 설정
    access_log /var/log/nginx/aakorea_access.log;
    error_log /var/log/nginx/aakorea_error.log;
}

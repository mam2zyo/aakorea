# termux 프로필 전용 설정
# 기본적으로 application.yml의 설정을 상속받습니다.
app:
  # Termux 환경 전용 데이터 저장 경로
  content:
    physical-root: ${AAKOREA_CONTENT_ROOT:/data/data/com.termux/files/home/aakorea/contents}
  storage:
    location: ${AAKOREA_STORAGE_ROOT:/data/data/com.termux/files/home/aakorea/uploads}

  # CORS 설정 (Termux 테스트 환경 전용 - 상속받은 설정 외에 추가)
  cors:
    allowed-origins:
      - https://maumtalk.win
      - https://www.maumtalk.win
      - http://maumtalk.win
      - http://www.maumtalk.win
      - https://maumtalk.win:8080
      - https://www.maumtalk.win:8080
      - http://maumtalk.win:8080
      - http://www.maumtalk.win:8080
      - http://localhost
      - http://127.0.0.1
      - http://localhost:8080
      - http://127.0.0.1:8080
spring:
  application:
    name: aakorea-main
  datasource:
    url: ${AAKOREA_DB_URL:jdbc:postgresql://localhost:5432/aakorea_main}
    username: ${AAKOREA_DB_USERNAME:aakorea_admin}
    password: ${AAKOREA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${AAKOREA_SERVER_PORT:8081}
  forward-headers-strategy: framework

app:
  content:
    physical-root: ${AAKOREA_CONTENT_ROOT:src/main/resources/contents}
  storage:
    location: ${AAKOREA_STORAGE_ROOT:backend/aakorea-main/uploads}
  auth:
    admin:
      email: ${AAKOREA_ADMIN_EMAIL:${AAKOREA_ADMIN_USERNAME}}
      password: ${AAKOREA_ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - https://aakorea.org
      - https://www.aakorea.org
      - http://localhost
      - http://127.0.0.1
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:5173
      - http://127.0.0.1:5173

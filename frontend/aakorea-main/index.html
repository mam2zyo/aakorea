<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAKorea Main</title>
    <script>
      (() => {
        const root = document.documentElement
        const { pathname, search } = window.location
        const searchParams = new URLSearchParams(search)
        const isAdminRoute = pathname === '/admin' || pathname.startsWith('/admin/')
        const adminThemeStorageKey = 'aakorea-admin-theme-preference'
        const publicActiveThemeStorageKey = 'aakorea-public-active-theme'
        const validAdminThemePreferences = ['system', 'light', 'dark']
        const publicBootstrapThemes = {
          classic: {
            background:
              'radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 30%), linear-gradient(180deg, #f7f2e8 0%, #efe4d2 100%)',
            color: '#241d16',
            colorScheme: 'light',
          },
          harbor: {
            background:
              'radial-gradient(circle at top left, rgba(255, 255, 255, 0.78), transparent 28%), linear-gradient(180deg, #eef7f7 0%, #d8eaeb 100%)',
            color: '#1f2c33',
            colorScheme: 'light',
          },
          breeze: {
            background:
              'radial-gradient(circle at top left, rgba(255, 255, 255, 0.82), transparent 28%), linear-gradient(180deg, #eff5fd 0%, #dbe8fb 100%)',
            color: '#1f2a38',
            colorScheme: 'light',
          },
        }
        const validPublicThemeIds = Object.keys(publicBootstrapThemes)

        function applyBootstrapSurface({ background, color, colorScheme }) {
          root.style.setProperty('--boot-body-background', background)
          root.style.setProperty('--boot-body-color', color)
          root.style.colorScheme = colorScheme
        }

        if (isAdminRoute) {
          let themePreference = 'system'

          try {
            const storedValue = window.localStorage.getItem(adminThemeStorageKey)
            if (validAdminThemePreferences.includes(storedValue)) {
              themePreference = storedValue
            }
          } catch {}

          const systemTheme =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          const resolvedTheme = themePreference === 'system' ? systemTheme : themePreference

          root.dataset.routeSurface = 'admin'
          root.dataset.adminTheme = resolvedTheme
          root.dataset.adminThemePreference = themePreference
          root.removeAttribute('data-public-theme')
          root.removeAttribute('data-public-active-theme')

          applyBootstrapSurface({
            background:
              resolvedTheme === 'dark'
                ? 'radial-gradient(circle at top left, rgba(63, 169, 120, 0.16), transparent 30%), linear-gradient(180deg, #0f151c 0%, #121a23 100%)'
                : 'radial-gradient(circle at top left, rgba(44, 106, 75, 0.08), transparent 28%), linear-gradient(180deg, #f6f1e6 0%, #f2ece1 100%)',
            color: resolvedTheme === 'dark' ? '#edf3f7' : '#241d16',
            colorScheme: resolvedTheme,
          })

          return
        }

        let activePublicThemeId = 'classic'

        try {
          const storedPublicThemeId = window.localStorage.getItem(publicActiveThemeStorageKey)
          if (validPublicThemeIds.includes(storedPublicThemeId)) {
            activePublicThemeId = storedPublicThemeId
          }
        } catch {}

        const previewThemeId = searchParams.get('themePreview')
        const publicThemeId = validPublicThemeIds.includes(previewThemeId)
          ? previewThemeId
          : activePublicThemeId

        root.dataset.routeSurface = 'public'
        root.dataset.publicActiveTheme = activePublicThemeId
        root.dataset.publicTheme = publicThemeId
        root.removeAttribute('data-admin-theme')
        root.removeAttribute('data-admin-theme-preference')

        applyBootstrapSurface(publicBootstrapThemes[publicThemeId] ?? publicBootstrapThemes.classic)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

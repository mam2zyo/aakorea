<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Theme Seed</title>
  </head>
  <body>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search)
        const theme = params.get('theme') || 'system'
        const redirectPath = params.get('redirect') || '/admin/login'

        try {
          window.localStorage.setItem('aakorea-admin-theme-preference', theme)
        } catch {}

        window.location.replace(redirectPath)
      })()
    </script>
  </body>
</html>

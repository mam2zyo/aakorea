<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AAKorea 관리자 콘솔입니다. 사이트 콘텐츠 및 모임 정보를 관리합니다." />
    <title>AAKorea Admin</title>
    <script>
      (() => {
        const root = document.documentElement
        const adminThemeStorageKey = 'aakorea-admin-theme-preference'
        const validAdminThemePreferences = ['system', 'light', 'dark']

        function applyBootstrapSurface({ background, color, colorScheme }) {
          root.style.setProperty('--boot-body-background', background)
          root.style.setProperty('--boot-body-color', color)
          root.style.colorScheme = colorScheme
        }

        let themePreference = 'system'
        try {
          const storedValue = window.localStorage.getItem(adminThemeStorageKey)
          if (validAdminThemePreferences.includes(storedValue)) {
            themePreference = storedValue
          }
        } catch {}

        const systemTheme =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        const resolvedTheme = themePreference === 'system' ? systemTheme : themePreference

        root.dataset.routeSurface = 'admin'
        root.dataset.adminTheme = resolvedTheme
        root.dataset.adminThemePreference = themePreference

        applyBootstrapSurface({
          background:
            resolvedTheme === 'dark'
              ? 'radial-gradient(circle at top left, rgba(63, 169, 120, 0.16), transparent 30%), linear-gradient(180deg, #0f151c 0%, #121a23 100%)'
              : 'radial-gradient(circle at top left, rgba(44, 106, 75, 0.08), transparent 28%), linear-gradient(180deg, #f6f1e6 0%, #f2ece1 100%)',
          color: resolvedTheme === 'dark' ? '#edf3f7' : '#241d16',
          colorScheme: resolvedTheme,
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-main.jsx"></script>
  </body>
</html>
